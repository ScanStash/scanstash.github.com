{% comment %} Embed language data for JavaScript access {% endcomment %}
<script>
window.LANGUAGE_DATA = {
  {% for lang_code in site.languages %}
  {% assign lang_data = site.data[lang_code] %}
  "{{ lang_code }}": {{ lang_data | jsonify }}{% unless forloop.last %},{% endunless %}
  {% endfor %}
};
window.DEFAULT_LANG = "{{ site.default_lang }}";
</script>
