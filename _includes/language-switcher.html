{% assign current_lang = page.lang | default: site.default_lang %}
{% assign languages = site.data.languages.languages %}

<div class="language-switcher">
  <select id="lang-select" onchange="switchLanguage(this.value)">
    {% for lang in languages %}
      <option value="{{ lang.code }}" {% if lang.code == current_lang %}selected{% endif %}>
        {{ lang.native_name }}
      </option>
    {% endfor %}
  </select>
</div>

<script>
// switchLanguage function is defined in language-updater.html
// This ensures it's available when the select changes
if (typeof window.switchLanguage === 'undefined') {
  window.switchLanguage = function(lang) {
    localStorage.setItem('preferred_lang', lang);
    var url = new URL(window.location);
    url.searchParams.set('lang', lang);
    window.location.reload();
  };
}
</script>

<style>
.language-switcher {
  display: inline-block;
  margin-left: 20px;
}

.language-switcher select {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 4px;
  color: #ffffff;
  padding: 5px 10px;
  font-size: 14px;
  cursor: pointer;
}

.language-switcher select:hover {
  background: rgba(255, 255, 255, 0.3);
}

.language-switcher select option {
  background: #333;
  color: #fff;
}
</style>
